<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulačka bodového ohodnocení</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        .container {
            max-width: 600px;
            margin: auto;
        }
        label, input, select {
            display: block;
            margin: 10px 0;
        }
        button {
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Kalkulačka bodového ohodnocení</h1>
        <form id="calculatorForm">
            <label for="distance">Vzdálenost (km, tam i zpět):</label>
            <input type="number" id="distance" name="distance" required>

            <label for="trips">Počet jízd za sezónu:</label>
            <input type="number" id="trips" name="trips" required>

            <label for="bikeType">Typ kola:</label>
            <select id="bikeType" name="bikeType" required>
                <option value="normal">Normální kolo</option>
                <option value="ebike">E-kolo</option>
            </select>

            <button type="button" onclick="calculatePoints()">Vypočítat body</button>
        </form>

        <h2>Celkové bodové ohodnocení: <span id="totalPoints">0</span></h2>
    </div>

    <script>
        function calculatePoints() {
            const distance = parseFloat(document.getElementById('distance').value);
            const trips = parseInt(document.getElementById('trips').value);
            const bikeType = document.getElementById('bikeType').value;

            let coefficient = 0;

            if (distance <= 10) {
                coefficient = 1;
            } else if (distance <= 20) {
                coefficient = 1.1;
            } else if (distance <= 30) {
                coefficient = 1.2;
            } else if (distance <= 40) {
                coefficient = 1.3;
            } else if (distance <= 50) {
                coefficient = 1.4;
            } else if (distance <= 60) {
                coefficient = 1.5;
            } else if (distance <= 70) {
                coefficient = 1.6;
            } else if (distance <= 80) {
                coefficient = 1.7;
            } else if (distance <= 90) {
                coefficient = 1.8;
            } else if (distance <= 100) {
                coefficient = 1.9;
            } else {
                coefficient = 2;
            }

            let points = coefficient * trips;

            if (bikeType === 'ebike') {
                points *= 0.6;
            }

            document.getElementById('totalPoints').innerText = points.toFixed(2);
        }
    </script>
</body>
</html>
